plugins {
    id 'java-library'
    alias(libs.plugins.spring.dependency.management)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencyManagement {
    imports {
        mavenBom "${libs.springBootBom.get()}"
    }
}

dependencies {
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    implementation project(':data')
    implementation libs.springContext

    implementation libs.squirrelFoundation

    testImplementation libs.junitJupiter
    testImplementation libs.mockitoCore
    testRuntimeOnly libs.junitPlatformLauncher
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    def scxmlFile = layout.buildDirectory.file('scxml/member-seminar-item.scxml')
    systemProperty 'scxml.output', scxmlFile.get().asFile.absolutePath
    outputs.file(scxmlFile)
}
