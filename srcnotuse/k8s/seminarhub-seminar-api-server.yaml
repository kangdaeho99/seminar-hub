apiVersion: apps/v1
kind: Deployment
metadata:
  name: seminarhub-seminar-api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      name: seminarhub-seminar-api-server
  template:
    metadata:
      labels:
        name: seminarhub-seminar-api-server
    spec:
      containers:
        - image: eoghdhdls/seminarhub-seminar-api-server
          name: seminarhub-seminar-api-server
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: seminarhub-seminar-api-server-dev
spec:
  ports:
    - port: 8080
      protocol: TCP
      name: "httpseminar"
      targetPort: 8080
  selector:
    name: seminarhub-seminar-api-server
