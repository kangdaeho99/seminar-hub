plugins {
    id 'org.springframework.boot' version '4.0.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

import org.springframework.boot.gradle.plugin.SpringBootPlugin

group = 'org.zerock'
version = '0.0.1-SNAPSHOT'

allprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
        }
    }

    dependencies {
        compileOnly libs.lombok
        annotationProcessor libs.lombok
        testCompileOnly libs.lombok
        testAnnotationProcessor libs.lombok
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

tasks.register('exportAllCode') {
    group = 'custom'
    description = '서브프로젝트의 모든 코드를 추출합니다.'

    def rootDirPath = layout.projectDirectory.asFile.absolutePath
    def outputFile = layout.projectDirectory.file('exported_all_code.txt').asFile
    def targetExtensions = ['java', 'gradle', 'kts', 'yml', 'yaml', 'properties', 'xml']
    def excludeDirs = ['build', 'out', '.gradle', 'bin', 'generated', 'srcnotuse', 'test-results']

    def subprojectsData = subprojects.collect { subproject ->
        [
                files: subproject.fileTree(subproject.projectDir) {
                    include targetExtensions.collect { extension -> "**/*.${extension}" }
                    exclude excludeDirs.collect { directory -> "**/${directory}/**" }
                }.files.sort { left, right -> left.absolutePath <=> right.absolutePath }
        ]
    }

    doLast {
        outputFile.withWriter('UTF-8') { writer ->
            writer << '=== Multi-Module Project Code Export ===\n\n'

            subprojectsData.each { data ->
                data.files.each { file ->
                    def relativePath = file.absolutePath.replace(rootDirPath + File.separator, '')

                    writer << "=================================================================\n"
                    writer << "File: ${relativePath}\n"
                    writer << "=================================================================\n"
                    writer << file.getText('UTF-8')
                    writer << '\n\n'
                }
            }
        }

        println "모든 코드가 성공적으로 추출되었습니다: ${outputFile.absolutePath}"
    }
}
