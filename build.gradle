plugins {
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
}

import org.springframework.boot.gradle.plugin.SpringBootPlugin

ext {
    querydslVersion = '5.1.0'
    lombokVersion = '1.18.32'
    springRetryVersion = '2.0.11'
}

group = 'org.zerock'
version = '0.0.1-SNAPSHOT'

allprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }
}

def libraryProjects = [
        project(':common'),
        project(':data')
]

def applicationProjects = [
        project(':boot:settlement-api'),
        project(':boot:batch')
]

def javaProjects = libraryProjects + applicationProjects

configure(libraryProjects) {
    apply plugin: 'java-library'
}

configure(applicationProjects) {
    apply plugin: 'java'
}

configure(javaProjects) {
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
        }
    }

    dependencies {
        compileOnly "org.projectlombok:lombok:${rootProject.ext.lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${rootProject.ext.lombokVersion}"
        testCompileOnly "org.projectlombok:lombok:${rootProject.ext.lombokVersion}"
        testAnnotationProcessor "org.projectlombok:lombok:${rootProject.ext.lombokVersion}"
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}


// 텍스트 파일로 코드를 추출하는 커스텀 Task
tasks.register("exportAllCode") {
    group = 'custom'
    description = '서브프로젝트의 모든 코드를 추출합니다.'

    // 1. Configuration 단계: Project 객체 참조를 피하기 위해 단순 경로(String) 리스트만 미리 수집
    def subprojectDirs = subprojects.collect { it.projectDir.absolutePath }
    def rootDirPath = layout.projectDirectory.asFile.absolutePath
    def outputFilePath = layout.projectDirectory.file("exported_all_code.txt")
    
    def targetExtensions = ['java', 'gradle', 'kts', 'yml', 'yaml', 'properties', 'xml']
    def excludeDirs = ['build', 'out', '.gradle', 'bin', 'generated', 'srcnotuse', 'test-results']

    doLast {
        def outputFile = outputFilePath.asFile
        outputFile.text = "=== Multi-Module Project Code Export ===\n\n"

        // 2. 실행 단계: Groovy의 표준 파일 순회 기능(traverse) 사용
        subprojectDirs.each { dirPath ->
            def baseDir = new File(dirPath)
            if (baseDir.exists()) {
                baseDir.traverse(
                    type: groovy.io.FileType.FILES,
                    preDir: { dir ->
                        // 제외할 폴더를 만나면 하위 탐색 생략 (속도 향상)
                        if (excludeDirs.contains(dir.name)) {
                            return groovy.io.FileVisitResult.SKIP_SUBTREE
                        }
                    }
                ) { file ->
                    // 확장자 확인
                    def fileName = file.name
                    def dotIndex = fileName.lastIndexOf('.')
                    
                    if (dotIndex > 0) {
                        def ext = fileName.substring(dotIndex + 1)
                        if (targetExtensions.contains(ext)) {
                            // 루트 경로를 제외한 상대 경로 문자열 만들기
                            def relativePath = file.absolutePath.replace(rootDirPath + File.separator, "")
                            
                            outputFile << "=================================================================\n"
                            outputFile << "File: ${relativePath}\n"
                            outputFile << "=================================================================\n"
                            outputFile << file.text
                            outputFile << "\n\n"
                        }
                    }
                }
            }
        }
        println "모든 코드가 성공적으로 추출되었습니다: ${outputFile.absolutePath}"
    }
}