server:
  port: 8080

spring:
  application:
    name: seminarhub-batch
  profiles:
    active: local

  config:
    import: optional:file:.env[.properties], optional:file:../.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seminar-hub?reWriteBatchedInserts=true}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 1000
        order_updates: true
        order_inserts: true
        generate_statistics: true
  batch:
    jdbc:
      initialize-schema: never
    job:
      name: NONE
      enabled: false

logging:
  level:
    org.springframework.transaction.interceptor: TRACE
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.stat: INFO
    org.hibernate.engine.jdbc.mutation: DEBUG
    org.hibernate.engine.jdbc.batch: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: INFO
    com.zaxxer.hikari.HikariConfig: DEBUG
    com.zaxxer.hikari.pool.HikariPool: DEBUG