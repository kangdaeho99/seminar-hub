spring:
  application:
    name: seminarhub-batch-test
  datasource:
    url: jdbc:h2:mem:seminarhub-batch;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=MEMBER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      name: NONE
      enabled: false
